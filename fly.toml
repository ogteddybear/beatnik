app = "ogteddybear-beatnik"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"
  build-target = "prod"

[env]
  NODE_ENV = "production"
  DATABASE_URL = "/data/library.db"
  LIBRARY_PATH = "/data/library"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options.response]
    pristine = true

    [http_service.http_options.response.headers]
      Server = "SashimiV4"
      # Approved static snapshot; this does not track future Fly Proxy builds.
      X-Hosting-Proxy = "Fly/9bb2ac9a88 (2026-11-23)"

[[mounts]]
  source = "beatnik_data"
  destination = "/data"
  initial_size = "20gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus = 1
  cpu_kind = "shared"
