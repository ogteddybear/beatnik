# fly.toml app configuration file generated for ogteddybear-beatnik on 2026-11-23T21:51:15Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'ogteddybear-beatnik'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_URL = '/data/library.db'
  LIBRARY_PATH = '/data/library'
  NODE_ENV = 'production'

[[mounts]]
  source = 'beatnik_data'
  destination = '/data'
  initial_size = '20gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
