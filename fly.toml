# fly.toml app configuration file generated for ogteddybear-beatnik on 2026-11-23T21:54:41Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = "ogteddybear-beatnik"
primary_region = 'sin'

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  DATABASE_URL = "/data/library.db"
  LIBRARY_PATH = "/data/library"

[[mounts]]
  source = "beatnik_data"
  destination = "/data"
  initial_size = "20gb"

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpus = 1
  cpu_kind = 'shared'

[http_service]
  auto_start_machines = true
  auto_stop_machines = true
  force_https = true
  internal_port = 8080
  min_machines_running = 0
  processes = ['app']
